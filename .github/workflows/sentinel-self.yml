name: Sentinel (self)

# Dogfooding: run Sentinel against this repo's own pull requests.
# The action's dist/ bundle is gitignored, so we build it from source before
# invoking the local action via `uses: ./`.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Run Sentinel
        uses: ./
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Commit the run's trace back to the PR branch so it reaches main on merge
      # and feeds the dashboard. Skipped for fork PRs, whose GITHUB_TOKEN cannot
      # push to the head branch. Failures here are NOT swallowed: this is the
      # observability pipeline, so a broken commit/push must fail the job loudly
      # instead of silently leaving the dashboard empty (the bug that hid a
      # never-committed trace before). A no-op (no traces, or no changes) exits 0.
      - name: Commit trace files
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          if [ -z "$(ls -A traces 2>/dev/null || true)" ]; then
            echo "No trace files were produced; nothing to commit."
            exit 0
          fi
          # The build/review checkout is the PR merge ref in detached, shallow
          # HEAD, which cannot be pushed back to the branch (the push is rejected
          # as non-fast-forward). Switch to the real head branch tip first; the
          # untracked traces/ files written during the run are carried across the
          # checkout, then committed on top of the true tip and fast-forwarded.
          git fetch --depth=1 origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traces/
          if git diff --cached --quiet; then
            echo "Trace files unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: add trace from sentinel run"
          git push origin HEAD:"${{ github.head_ref }}"
