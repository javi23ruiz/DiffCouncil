name: Sentinel (self)

# Dogfooding: run Sentinel against this repo's own pull requests.
# The action's dist/ bundle is gitignored, so we build it from source before
# invoking the local action via `uses: ./`.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Run Sentinel
        uses: ./
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trace files
        if: success()
        run: |
          if [ -d traces ] && [ "$(ls -A traces 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add traces/
            git commit -m "chore: add trace from sentinel run" || true
            git push origin HEAD:"${{ github.head_ref }}" || true
          fi
